name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload APK as artifact'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Debug APK (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Locate project root ───────────────────────────────────────────────
      # Handles repos where pubspec.yaml isn't at git root (e.g. the project
      # lives in a subdirectory after unzipping). Searches up to 3 levels deep,
      # takes the shallowest hit, writes PROJECT_DIR to GITHUB_ENV so every
      # subsequent step can use working-directory: ${{ env.PROJECT_DIR }}.
      - name: Locate Flutter project root
        run: |
          set -euo pipefail
          PUBSPEC=$(find . -name "pubspec.yaml" -not -path "*/.*" | sort | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml not found anywhere in the repo — cannot build."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found pubspec.yaml → $PUBSPEC"
          echo "Project root set to: $PROJECT_DIR"
          ls "$PROJECT_DIR"

      # ── 3. Java 17 ───────────────────────────────────────────────────────────
      # AGP 8.11.1 + Kotlin 2.2.20 require Java 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ── 4. Flutter ───────────────────────────────────────────────────────────
      # pubspec.yaml requires Dart SDK ^3.11.5. Stable channel ships a matching
      # Dart. Flutter 3.47.5 (current stable) ships Dart 3.13.4 which satisfies
      # ^3.11.5. Pin flutter-version if you need byte-for-byte reproducibility.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-stable-${{ runner.os }}

      - name: Flutter version
        run: flutter --version

      # ── 5. Pub cache ─────────────────────────────────────────────────────────
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # ── 6. Gradle cache ──────────────────────────────────────────────────────
      # The CloudStream + Aniyomi transitive graph is large (~600 MB of jars).
      # Caching the Gradle home cuts 3-5 minutes off every non-clean run.
      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 7. Gradle JVM memory ─────────────────────────────────────────────────
      # gradle.properties asks for -Xmx8G; ubuntu-latest has ~7 GB total.
      # Cap at 5 GB so the CloudStream dex merge step doesn't OOM.
      # Kotlin daemon gets 2 GB separately via KOTLIN_DAEMON_JVM_OPTS.
      - name: Override Gradle JVM args for CI
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          sed -i \
            's|org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8|' \
            android/gradle.properties
          echo "Patched gradle.properties JVM args:"
          grep "org.gradle.jvmargs" android/gradle.properties
          echo "GRADLE_OPTS=-Dorg.gradle.daemon=false" >> "$GITHUB_ENV"
          echo "KOTLIN_DAEMON_JVM_OPTS=-Xmx2G"        >> "$GITHUB_ENV"

      # ── 8. Pub get ───────────────────────────────────────────────────────────
      - name: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # ── 9. Debug APK ─────────────────────────────────────────────────────────
      # --split-per-abi → one APK per ABI (arm64-v8a, armeabi-v7a).
      # --no-shrink is explicit even though isMinifyEnabled = false in Gradle —
      # belt + suspenders for the CloudStream class-name runtime links.
      - name: Build debug APK (arm64 + arm)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          FLUTTER_SUPPRESS_ANALYTICS: true
        run: |
          flutter build apk \
            --debug \
            --target-platform android-arm64,android-arm \
            --split-per-abi \
            --no-shrink

      # ── 10. Collect outputs ──────────────────────────────────────────────────
      - name: List APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== APKs built ==="
          find build/app/outputs/apk/debug -name "*.apk" | while read f; do
            echo "  $f  [$(du -sh "$f" | cut -f1)]"
          done

      # ── 11. Upload artifacts (one per ABI so you can download only what you need) ──
      - name: Upload arm64-v8a APK
        if: ${{ github.event_name != 'pull_request' || inputs.upload_artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: zangetsu-debug-arm64-${{ github.sha }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/apk/debug/*arm64-v8a*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        if: ${{ github.event_name != 'pull_request' || inputs.upload_artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: zangetsu-debug-arm32-${{ github.sha }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/apk/debug/*armeabi-v7a*.apk
          retention-days: 14
          if-no-files-found: error

      # ── 12. Build summary ────────────────────────────────────────────────────
      - name: Write build summary
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          {
            echo "## Build result"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Project root | \`${{ env.PROJECT_DIR }}\` |"
            echo "| Runner | \`${{ runner.os }}\` |"
            echo "| Flutter channel | stable |"
            echo ""
            flutter --version 2>&1 | head -1 | awk '{print "**Flutter**: "$0}'
            echo ""
            echo "### APKs"
            echo "\`\`\`"
            find build/app/outputs/apk/debug -name "*.apk" 2>/dev/null \
              | while read f; do echo "$(basename "$f")  [$(du -sh "$f" | cut -f1)]"; done \
              || echo "(build failed — no APKs)"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
